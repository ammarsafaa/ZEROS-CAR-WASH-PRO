name: Build Windows Installer (CAR WASH PRO)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Build desktop app (offline SPA)
        run: bunx vite build -c vite.desktop.config.ts

      - name: Verify app output
        shell: bash
        run: test -f dist/client/index.html

      - name: Stage Electron app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item electron -Destination pkg/electron -Recurse -Force
          New-Item -ItemType Directory -Force pkg/dist | Out-Null
          Copy-Item dist/client -Destination pkg/dist/client -Recurse -Force
          Copy-Item electron/package.json -Destination pkg/package.json -Force

      - name: Package installer
        shell: bash
        run: |
          cd pkg
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never
          test -f release/win-unpacked/resources/app/index.html

      - name: Publish update (GitHub Release)
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          gh release create "v${VERSION}" \
            pkg/release/*.exe \
            pkg/release/*.blockmap \
            pkg/release/latest.yml \
            --title "CAR WASH PRO v${VERSION}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: CarWashPro-Setup
          path: pkg/release/*.exe
